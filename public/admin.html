<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VENORI Admin</title><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><a class="logo" href="/">VEN<span>ORI</span></a><nav class="nav"><a href="/">Játékos oldal</a></nav><div class="wallet">🛡️ ADMIN</div></header><main class="wrap"><section class="card section"><h2>VENORI Admin Panel</h2><div class="profile" id="stats"></div></section><section class="columns"><div class="card section"><h3>👥 Játékosok</h3><input class="input" id="search" placeholder="Keresés"><div id="users"></div></div><div class="card section"><h3>🪙 Coin kezelés</h3><input class="input" id="uid" type="number" placeholder="Játékos ID"><input class="input" id="amount" type="number" placeholder="+5000 vagy -5000"><input class="input" id="reason" placeholder="Indok"><button class="btn primary" id="coinBtn">Mentés</button><h3 style="margin-top:24px">⚙️ Beállítások</h3><input class="input" id="daily" type="number"><input class="input" id="price" type="number"><input class="input" id="announcement"><label><input id="maintenance" type="checkbox"> Karbantartási mód</label><br><button class="btn primary" id="save" style="margin-top:12px">Mentés</button></div></section><section class="card section"><h3>📜 Coin tranzakciók</h3><div id="tx"></div></section></main><div class="toast" id="toast"></div><script>
const $=s=>document.querySelector(s),fmt=n=>Number(n||0).toLocaleString("hu-HU");async function api(u,o={}){const r=await fetch(u,{...o,headers:{"Content-Type":"application/json"}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Hiba");return d}function toast(x){const t=$("#toast");t.textContent=x;t.style.display="block";setTimeout(()=>t.style.display="none",2500)}
async function stats(){const d=await api("/api/admin/stats");$("#stats").innerHTML=[["Játékosok",d.users],["Aktív",d.active],["Tiltva",d.banned],["Eljátszott",d.played],["Nyitások",d.opened],["Coin",d.coins]].map(x=>`<div class="metric"><small>${x[0]}</small><b>${fmt(x[1])}</b></div>`).join("")}
async function users(){const d=await api("/api/admin/users?q="+encodeURIComponent($("#search").value));$("#users").innerHTML=d.rows.map(u=>`<div class="list-item"><b>#${u.id} ${u.username}</b> · ${fmt(u.coins)} Coin · ${u.banned?"TILTVA":"AKTÍV"}<br><button class="btn" onclick="pick(${u.id})">Coin</button> <button class="btn" onclick="ban(${u.id},${!u.banned})">${u.banned?"Feloldás":"Tiltás"}</button></div>`).join("")}
async function settings(){const d=await api("/api/admin/settings");$("#daily").value=d.daily_bonus;$("#price").value=d.chest_price;$("#announcement").value=d.announcement;$("#maintenance").checked=d.maintenance}
async function tx(){const d=await api("/api/admin/transactions");$("#tx").innerHTML=d.rows.map(x=>`<div class="stat"><span>${x.username} · ${x.reason}</span><b>${x.amount>0?"+":""}${fmt(x.amount)}</b></div>`).join("")}
function pick(id){$("#uid").value=id}async function ban(id,b){try{await api("/api/admin/ban",{method:"POST",body:JSON.stringify({userId:id,banned:b})});await Promise.all([users(),stats()])}catch(e){toast(e.message)}}
$("#search").oninput=users;$("#coinBtn").onclick=async()=>{try{await api("/api/admin/coins",{method:"POST",body:JSON.stringify({userId:+$("#uid").value,amount:+$("#amount").value,reason:$("#reason").value})});toast("Coin módosítva");await Promise.all([users(),stats(),tx()])}catch(e){toast(e.message)}};$("#save").onclick=async()=>{try{await api("/api/admin/settings",{method:"POST",body:JSON.stringify({daily_bonus:+$("#daily").value,chest_price:+$("#price").value,announcement:$("#announcement").value,maintenance:$("#maintenance").checked})});toast("Mentve")}catch(e){toast(e.message)}};
(async()=>{try{const me=await api("/api/me");if(me.user.role!=="admin")throw Error();await Promise.all([stats(),users(),settings(),tx()])}catch{location.href="/"}})();
</script></body></html>
